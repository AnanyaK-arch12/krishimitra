<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrishiMitra</title>
<style>
  :root{--g:#2e7d32;--bg:#f3f8f1;--ink:#1b2a1b;--mut:#5b6b5b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--g);color:#fff;padding:16px;text-align:center}
  header h1{margin:0;font-size:1.5rem}
  header p{margin:4px 0 0;font-size:.9rem;opacity:.9}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  label{font-weight:600;display:block;margin:10px 0 6px}
  select,button,input[type=file]{font-size:1.05rem;border-radius:10px;border:1px solid #c5d3c5;padding:12px;width:100%;background:#fff}
  button{background:var(--g);color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:12px}
  button.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
  button:disabled{opacity:.5;cursor:not-allowed}
  #preview{width:100%;border-radius:10px;margin-top:12px;display:none}
  .bar{height:12px;background:#e3ebe3;border-radius:6px;overflow:hidden;margin:6px 0}
  .bar span{display:block;height:100%;background:var(--g)}
  h2{margin:0 0 4px} h3{margin:16px 0 6px}
  ul{padding-left:20px} li{margin-bottom:6px}
  .warn{background:#fff4e0;border-radius:10px;padding:10px;margin-top:12px}
  .help{background:#e8f0fe;border-radius:10px;padding:10px;margin-top:12px}
  .msg{border-radius:10px;padding:12px;margin-bottom:14px;background:#eef6ee}
  .msg.err{background:#fde8e8;color:#8a1c1c}
  .hidden{display:none}
  small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>🌿 KrishiMitra</h1>
  <p>Your crop doctor. Photo in, advice out.</p>
</header>
<main>
  <div class="card">
    <label for="lang">Language / ಭಾಷೆ / भाषा</label>
    <select id="lang">
      <option value="English">English</option>
      <option value="Kannada">ಕನ್ನಡ (Kannada)</option>
      <option value="Hindi">हिन्दी (Hindi)</option>
    </select>

    <label for="photo">Leaf photo</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" alt="Leaf preview">
    <button id="go" disabled>Diagnose</button>
  </div>

  <div id="status" class="msg hidden"></div>

  <div id="result" class="card hidden">
    <small id="crop"></small>
    <h2 id="disease"></h2>
    <small>Confidence: <b id="confText"></b></small>
    <div class="bar"><span id="confBar"></span></div>

    <h3>What you see</h3>
    <p id="symptoms"></p>

    <h3>What to do</h3>
    <ul id="treatment"></ul>

    <div class="warn"><b>⚠ Safety:</b> <span id="safety"></span></div>
    <div id="helpline" class="help hidden"></div>

    <button id="speak" class="sec">🔊 Listen to advice</button>
    <small id="voiceNote"></small>
  </div>
</main>

<script>
const LANG_CODES = { English: "en-IN", Hindi: "hi-IN", Kannada: "kn-IN" };
const $ = id => document.getElementById(id);
let imageBlob = null;
let speechText = "";

function setStatus(text, isError) {
  const s = $("status");
  s.textContent = text;
  s.className = "msg" + (isError ? " err" : "") + (text ? "" : " hidden");
}

// Shrink the photo before upload: faster and cheaper
function shrink(file, max = 1024) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

$("photo").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  imageBlob = await shrink(f);
  $("preview").src = URL.createObjectURL(imageBlob);
  $("preview").style.display = "block";
  $("go").disabled = false;
});

$("go").addEventListener("click", async () => {
  const lang = $("lang").value;
  $("go").disabled = true;
  $("result").classList.add("hidden");
  window.speechSynthesis.cancel();
  setStatus("Analysing your leaf… this can take up to a minute.");

  const fd = new FormData();
  fd.append("image", imageBlob, "leaf.jpg");
  fd.append("lang", lang);

  try {
    const r = await fetch("/diagnose", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Server error");
    show(d, lang);
    setStatus("");
  } catch (err) {
    setStatus("Sorry, something went wrong: " + err.message, true);
  }
  $("go").disabled = false;
});

function show(d, lang) {
  $("crop").textContent = "Crop: " + d.crop;
  $("disease").textContent = d.disease;
  $("confText").textContent = d.confidence + "%";
  $("confBar").style.width = Math.max(0, Math.min(100, d.confidence)) + "%";
  $("symptoms").textContent = d.symptoms;
  $("treatment").innerHTML = "";
  (d.treatment || []).forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    $("treatment").appendChild(li);
  });
  $("safety").textContent = d.safety;

  const h = $("helpline");
  if (d.fallback) {
    h.textContent = "Not sure about this one. Please call: " + d.fallback;
    h.classList.remove("hidden");
  } else {
    h.classList.add("hidden");
  }
  speechText = [d.disease, d.symptoms, (d.treatment || []).join(". "), d.safety].join(". ");
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
  speak(lang);
}
let audioEl = null;

async function speak(lang) {
  window.speechSynthesis.cancel();
  if (audioEl) audioEl.pause();
  $("voiceNote").textContent = "Preparing audio…";
  try {
    const fd = new FormData();
    fd.append("text", speechText);
    fd.append("lang", lang);
    const r = await fetch("/speak", { method: "POST", body: fd });
    if (!r.ok) throw new Error("audio failed");
    const blob = await r.blob();
    audioEl = new Audio(URL.createObjectURL(blob));
    await audioEl.play();
    $("voiceNote").textContent = "";
  } catch (e) {
    // fallback: the browser's own voice
    const code = LANG_CODES[lang] || "en-IN";
    const u = new SpeechSynthesisUtterance(speechText);
    u.lang = code;
    window.speechSynthesis.speak(u);
    $("voiceNote").textContent = "Server audio unavailable, using device voice.";
  }
}

$("speak").addEventListener("click", () => speak($("lang").value));
</script>
</body>
</html>
